name: Auto Build PC PSU Calculator, Daily Cumulative Reviews & SEO Ping

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Berjalan otomatis setiap hari pukul 04:00 UTC untuk menerbitkan +1 artikel review baru
    - cron: '0 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate PC PSU Calculator, Daily Growing Reviews, Comparisons & Ping IndexNow
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python generate_pcwatt_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
